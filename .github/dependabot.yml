# Keeps the GitHub Actions in .github/workflows current (one PR per action, checked monthly; CI tests each PR).
# Gradle dependencies (Paper API, MockBukkit) are left out on purpose: they follow the Minecraft version and
# are upgraded by hand (docs/CI.md, "Pins").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
